# A person tests PIKY by hand on a temporary GitHub-hosted Mac whose desktop
# belongs to a user with a known password: the temporary administrator is
# logged in at the screen (Fast User Switching, macOS's own login window), and
# RustDesk runs inside that session, never under the runner's own account.
#
# Why: on macOS 26, Gatekeeper's Open Anyway asks for the password of the user
# who owns the desktop. On the runner's own desktop nobody knows it.
#
# Started by hand only, by the owner of this repository only, on a standard
# GitHub-hosted Apple silicon runner (free for a public repository). It needs
# the repository secret QA_SESSION_PASSPHRASE; the session's details are
# uploaded only as ciphertext, and only after every gate has passed.
# See docs/INTERACTIVE-OWN-DESKTOP.md.
name: Interactive macOS QA (own desktop)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'How long the Mac stays up once it is ready, in minutes (5 to 120)'
        type: string
        default: '60'

permissions:
  contents: read

# Every step runs under bash with -e and -o pipefail, and never with -x.
defaults:
  run:
    shell: bash

concurrency:
  group: interactive-macos-qa
  cancel-in-progress: false

jobs:
  session:
    name: Interactive QA on macOS 26, on the temporary administrator's own desktop
    if: github.actor == github.repository_owner
    runs-on: macos-26
    timeout-minutes: 180
    env:
      NO_COLOR: '1'
      QA_REMOTE: rustdesk-console
      QA_RUNNER_LABEL: macos-26
      QA_SESSION_MINUTES: ${{ inputs.session_minutes }}
      QA_TOOLS: ${{ github.workspace }}/build
      QA_OUT: ${{ github.workspace }}/evidence/setup
    steps:
      - name: The session can be opened safely (it stops here if not)
        env:
          QA_SESSION_PASSPHRASE: ${{ secrets.QA_SESSION_PASSPHRASE }}
        run: |
          if [ -z "${QA_SESSION_PASSPHRASE:-}" ]; then
            echo "::error::The repository secret QA_SESSION_PASSPHRASE is not set. Without it the session's details could only be uploaded readable by anyone, so nothing was started. See docs/INTERACTIVE-RUSTDESK.md."
            exit 1
          fi
          if [ "${#QA_SESSION_PASSPHRASE}" -lt 20 ]; then
            echo "::error::QA_SESSION_PASSPHRASE must be at least 20 characters. Nothing was started."; exit 1
          fi
          case "$QA_SESSION_MINUTES" in ''|*[!0-9]*) echo "::error::session_minutes must be a whole number."; exit 1 ;; esac
          if [ "$QA_SESSION_MINUTES" -lt 5 ] || [ "$QA_SESSION_MINUTES" -gt 120 ]; then
            echo "::error::session_minutes must be between 5 and 120."; exit 1
          fi
          sw_vers; uname -m
          if [ "${RUNNER_ENVIRONMENT:-}" != github-hosted ] || [ "$(uname -m)" != arm64 ]; then
            echo "::error::This workflow runs on standard GitHub-hosted Apple silicon runners only."; exit 1
          fi
          if [ "$(sw_vers -productVersion | cut -d. -f1)" != 26 ]; then
            echo "::error::Asked for macOS 26 but this machine is macOS $(sw_vers -productVersion)."; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the QA tools here and lay out the kit (PIKY itself is not installed)
        run: |
          /usr/bin/python3 TestFiles/generate.py --check
          /usr/bin/python3 TestPage/build.py --check
          NEWEST="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' 2>/dev/null | grep -viE 'beta|candidate' | sort -V | tail -1 || true)"
          if [ -n "$NEWEST" ]; then sudo -n xcode-select -s "$NEWEST/Contents/Developer" || true; fi
          bash harness/build-tools.sh "$QA_TOOLS"
          bash interactive/session.sh kit
          bash probe/console-user-probe.sh prepare

      - name: Two random passwords for this session (masked at once)
        run: bash interactive/session.sh credentials

      - name: The temporary administrator
        run: bash interactive/session.sh admin-create

      - name: RustDesk, one pinned release, checked against its SHA-256 (not started yet)
        run: bash interactive/session.sh rustdesk-install

      - name: Log the temporary administrator in at the screen (Fast User Switching, macOS's login window)
        timeout-minutes: 15
        run: /usr/bin/python3 interactive/console_session.py login

      - name: Control gate, with no screenshot (TextEdit, type, read back, change focus)
        timeout-minutes: 12
        run: /usr/bin/python3 interactive/console_session.py gate

      - name: Screen capture on that desktop (macOS's own consent dialog, if it asks)
        timeout-minutes: 10
        run: /usr/bin/python3 interactive/console_session.py consent

      - name: Start RustDesk inside the temporary administrator's session
        timeout-minutes: 10
        run: |
          bash interactive/session.sh rustdesk-start
          bash interactive/session.sh kit-desktop

      - name: Session ready gate
        timeout-minutes: 15
        run: |
          set +e
          /usr/bin/python3 interactive/console_session.py ready
          QA_STATUS=$?
          set -e
          if [ "$QA_STATUS" = 10 ]; then
            # macOS's consent was answered while RustDesk was running: started again, once.
            sudo -n pkill -x RustDesk >/dev/null 2>&1 || true
            sleep 4
            bash interactive/session.sh rustdesk-start
            /usr/bin/python3 interactive/console_session.py ready --final
          elif [ "$QA_STATUS" != 0 ]; then
            exit "$QA_STATUS"
          fi

      - name: Encrypt the session's details for the repository owner
        env:
          QA_SESSION_PASSPHRASE: ${{ secrets.QA_SESSION_PASSPHRASE }}
        run: bash interactive/session.sh session-note

      - name: Upload the encrypted session note (ciphertext only)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: piky-interactive-session-${{ github.run_id }}
          path: session-artifact/
          if-no-files-found: error
          retention-days: 1

      - name: The session is open
        run: |
          {
            echo "## The Mac is ready: macOS $(sw_vers -productVersion) ($(sw_vers -buildVersion)), and the desktop is the temporary administrator's own"
            echo
            echo "Open for $QA_SESSION_MINUTES minutes. The RustDesk ID and both passwords are in the artifact"
            echo "\`piky-interactive-session-$GITHUB_RUN_ID\`, encrypted with QA_SESSION_PASSPHRASE. Nothing readable is published."
            echo
            echo "To end early: on the Mac, move \"END SESSION - delete this file\" (Desktop › PIKY-QA) to the Trash."
          } >> "$GITHUB_STEP_SUMMARY"
          bash interactive/session.sh keep-alive

      - name: Collect privacy-safe evidence
        if: always()
        run: bash interactive/session.sh collect

      - name: Nothing secret in the evidence
        if: always()
        run: bash harness/check-evidence.sh "$GITHUB_WORKSPACE/evidence"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: piky-interactive-qa-macos-26-own-desktop-run${{ github.run_number }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

      # GitHub destroys the machine; this makes sure nothing of the session outlives the step.
      - name: Stop RustDesk, log the temporary administrator out, delete it and every credential
        if: always()
        timeout-minutes: 8
        run: bash interactive/session.sh teardown
